<script>
/* Lê ?c= (lista fixa), monta o link do Play com o referrer URL-encoded
   e redireciona no celular. No computador a pessoa fica na página e clica no botão. */
(function () {
  var PLAY = 'https://play.google.com/store/apps/details?id=com.littlehandsstudio.zodiactrek';
  var ACEITOS = { exagerado: 1, moderno: 1 };
  var c = '';
  try { c = (new URLSearchParams(location.search).get('c') || '').trim().toLowerCase(); } catch (e) {}
  if (!ACEITOS.hasOwnProperty(c)) c = 'geral';
  var referrer = 'utm_source=meta&utm_medium=paid&utm_campaign=zt_teste_meta&utm_content=video_' + c;
  var link = PLAY + '&referrer=' + encodeURIComponent(referrer);
  window.__ztPlayLink = link;
  var ua = navigator.userAgent || '';
  var mobile = /Android|iPhone|iPad|iPod|Mobile/i.test(ua) ||
               (/Macintosh/i.test(ua) && 'ontouchend' in document);
  if (mobile) window.location.replace(link);
})();
</script>
